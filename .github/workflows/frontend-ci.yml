name: HireFlow Frontend CI & Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-secret-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. Gitleaks scan to prevent leaking API keys or tokens in frontend code
    - name: Run Gitleaks Secret Scanner
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: false

    # 2. NPM security audit for frontend packages
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Run NPM Security Audit
      run: npm audit --audit-level=high

  build-and-test:
    name: Build & Test React SPA (Vite + TypeScript)
    needs: [security-and-secret-scan]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Vitest unit tests
      run: npm test -- --run

    - name: Run production build (TypeScript + Vite)
      run: npm run build
